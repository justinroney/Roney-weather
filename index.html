<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#05080F" media="(prefers-color-scheme: dark)">
<title>Roney Weather</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Roney Weather — one hand-written file, zero dependencies, same instrument-panel
   look as the routine app. Forecasts and air quality come from Open-Meteo (free,
   no key), severe-weather warnings from the National Weather Service, radar
   frames from Rain Viewer, base map tiles from OpenStreetMap. The last good
   forecast per saved place is kept on the device so the app still says
   something useful with no signal. */
:root {
  --ground:#05080F; --glow-top:#132A4A;
  --card:rgba(19,28,45,.72); --card-solid:#131C2D;
  --card2:rgba(255,255,255,.055); --line:rgba(255,255,255,.10);
  --ink:#EAF2FF; --dim:#9FB3D0; --faint:#8497B4;
  --blue:#35DFFF; --blue-soft:rgba(53,223,255,.13);
  --good:#3EE08C; --warn:#FFC65C; --crit:#FF6B6B;
  --sun:#FFC65C; --rain:#35DFFF; --snow:#EAF2FF; --hot:#FFB347; --cold:#35DFFF;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs-title:16px; --fs-body:15px; --fs-label:13.5px; --fs-cap:12.5px; --fs-micro:11px;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
  --edge:inset 0 1px 0 rgba(255,255,255,.11);
  --blur:saturate(150%) blur(14px);
  --r:16px;
  --tilefilter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.55);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ground:#F5F6F8; --glow-top:#E3ECF7;
    --card:#FFFFFF; --card-solid:#FFFFFF; --card2:#F1F4F6; --line:#E4E9ED;
    --ink:#1F2A33; --dim:#5A6874; --faint:#626E7A;
    --blue:#0063AE; --blue-soft:rgba(0,99,174,.09);
    --good:#16663A; --warn:#7A4E00; --crit:#A32A1A;
    --sun:#D98B00; --rain:#0063AE; --snow:#5A6874; --hot:#C2410C; --cold:#0063AE;
    --shadow:0 1px 2px rgba(31,42,51,.06),0 4px 14px rgba(31,42,51,.05);
    --edge:none; --blur:none; --tilefilter:none;
  }
}
:root[data-theme="light"]{
  --ground:#F5F6F8; --glow-top:#E3ECF7;
  --card:#FFFFFF; --card-solid:#FFFFFF; --card2:#F1F4F6; --line:#E4E9ED;
  --ink:#1F2A33; --dim:#5A6874; --faint:#626E7A;
  --blue:#0063AE; --blue-soft:rgba(0,99,174,.09);
  --good:#16663A; --warn:#7A4E00; --crit:#A32A1A;
  --sun:#D98B00; --rain:#0063AE; --snow:#5A6874; --hot:#C2410C; --cold:#0063AE;
  --shadow:0 1px 2px rgba(31,42,51,.06),0 4px 14px rgba(31,42,51,.05);
  --edge:none; --blur:none; --tilefilter:none;
}
:root[data-theme="dark"]{
  --ground:#05080F; --glow-top:#132A4A;
  --card:rgba(19,28,45,.72); --card-solid:#131C2D;
  --card2:rgba(255,255,255,.055); --line:rgba(255,255,255,.10);
  --ink:#EAF2FF; --dim:#9FB3D0; --faint:#8497B4;
  --blue:#35DFFF; --blue-soft:rgba(53,223,255,.13);
  --good:#3EE08C; --warn:#FFC65C; --crit:#FF6B6B;
  --sun:#FFC65C; --rain:#35DFFF; --snow:#EAF2FF; --hot:#FFB347; --cold:#35DFFF;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.35);
  --edge:inset 0 1px 0 rgba(255,255,255,.11);
  --blur:saturate(150%) blur(14px);
  --tilefilter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.55);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 520px at 50% -14%, var(--glow-top) 0%, transparent 68%),
    radial-gradient(600px 400px at 100% 8%, color-mix(in srgb,var(--blue) 7%,transparent) 0%, transparent 60%);
  opacity:.85}
#app{max-width:600px;margin:0 auto;padding:0 0 40px}
button{font-family:var(--sans);color:inherit;cursor:pointer}
button,.hr,.day,.lrow,.mapz button{user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}
[hidden]{display:none !important}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.hdr-top{display:flex;align-items:center;gap:6px}
.hdr-side{width:92px;display:flex;align-items:center;gap:2px}
.hdr-side.right{justify-content:flex-end}
.hdr-title{flex:1;min-width:0;background:none;border:none;font-weight:700;font-size:17px;
  letter-spacing:-.01em;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-height:44px;padding:0 4px;border-radius:10px}
.hdr-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-title svg{width:16px;height:16px;flex:none;color:var(--dim)}
.hdr-sub{text-align:center;font-size:var(--fs-cap);color:var(--dim);margin-top:-2px;min-height:18px}
.ibtn{background:none;border:none;width:44px;height:44px;display:grid;place-items:center;
  border-radius:50%;color:var(--dim);font-weight:700;font-size:15px;position:relative}
.ibtn svg{width:19px;height:19px}
.ibtn:active{transform:scale(.9)}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- view + cards ---------- */
#view{padding:10px 12px 0}
.sec-label{font-size:var(--fs-micro);font-weight:800;color:var(--dim);margin:20px 8px 8px;
  text-transform:uppercase;letter-spacing:.11em;display:flex;justify-content:space-between;align-items:baseline}
.sec-label .aside{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:none}
.card{background:var(--card);border-radius:var(--r);padding:15px 16px;
  border:1px solid var(--line);box-shadow:var(--shadow),var(--edge);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.card + .card{margin-top:11px}
.note{font-size:var(--fs-cap);color:var(--faint);text-align:center;margin:18px 8px 0;line-height:1.5}
.note button,.linkbtn{background:none;border:none;color:var(--blue);font-weight:600;font-size:inherit;padding:0 2px}

/* ---------- alerts ---------- */
.alertbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;
  text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tone);
  border-radius:14px;padding:11px 12px 11px 13px;margin-bottom:11px;box-shadow:var(--shadow),var(--edge);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.alertbar .dot{width:12px;height:12px;border-radius:50%;background:var(--tone);box-shadow:0 0 10px var(--tone)}
.alertbar.crit .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.alertbar b{display:block;font-size:var(--fs-body)}
.alertbar small{display:block;color:var(--dim);font-size:var(--fs-cap)}
.alertbar .chev{color:var(--faint);font-size:20px}
.crit{--tone:var(--crit)} .warn{--tone:var(--warn)} .watch{--tone:var(--hot)} .info{--tone:var(--blue)}
.al{border-left:4px solid var(--tone);padding-left:12px}
.al + .al{margin-top:11px}
.al summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:44px}
.al summary::-webkit-details-marker{display:none}
.al summary b{font-size:var(--fs-body)}
.al summary small{display:block;color:var(--dim);font-size:var(--fs-cap);margin-top:2px}
.al summary .sev{font-size:var(--fs-micro);font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tone)}
.al .body{font-size:var(--fs-label);color:var(--dim);white-space:pre-wrap;margin-top:8px;line-height:1.5}
.al .body b{color:var(--ink);display:block;margin:10px 0 2px}
.al .meta{font-size:var(--fs-cap);color:var(--faint);margin-top:10px}

/* ---------- hero ---------- */
.hero{padding:18px 18px 14px}
.hero-row{display:flex;align-items:center;gap:14px}
.hero-sum{font-size:var(--fs-label);color:var(--ink);margin-top:12px;line-height:1.5;border-top:1px solid var(--line);padding-top:11px}
.allclear{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:var(--fs-label);color:var(--dim);
  padding:9px 13px;margin-top:11px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.allclear .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.allclear.off .dot{background:var(--faint);box-shadow:none}
.allclear small{display:block;font-size:var(--fs-micro);color:var(--faint)}
.legend{font-size:var(--fs-micro);color:var(--faint);margin:7px 10px 0;line-height:1.45;text-align:center}
.hero-main{flex:1;min-width:0}
.hero-temp{font-size:68px;font-weight:300;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero-temp .deg{font-size:34px;vertical-align:top;color:var(--dim);font-weight:400;margin-left:2px}
.hero-cond{font-size:18px;font-weight:600;margin-top:6px}
.hero-sub{font-size:var(--fs-label);color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
.hero-ico{flex:none;width:112px;height:112px}
.hero-ico svg{width:100%;height:100%}

/* ---------- next two hours ---------- */
.nowcast{margin-top:11px;padding:12px 16px 10px}
.nowcast .t{font-size:var(--fs-label);font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.nowcast .t small{color:var(--faint);font-size:var(--fs-micro);font-weight:600}
.ncbars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;height:38px;align-items:end;margin-top:8px}
.ncbars i{display:block;background:var(--rain);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.ncbars i.dry{background:var(--card2);opacity:1}
.nclab{display:grid;grid-template-columns:repeat(4,1fr);font-size:var(--fs-micro);color:var(--faint);margin-top:4px}
.nclab span:last-child{text-align:right}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;text-align:left;font:inherit;color:inherit;
  box-shadow:var(--shadow),var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);min-width:0;display:flex;flex-direction:column;width:100%;height:100%}
.tile:active{transform:scale(.98)}
.tile .m{height:3px;border-radius:2px;background:var(--card2);margin-top:auto;padding-top:0;position:relative;overflow:hidden;flex:none}
.tile .s{margin-bottom:9px}
.tile .m i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--tone,var(--blue))}
.tile.good{--tone:var(--good)}
.tile .k{font-size:var(--fs-micro);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.09em}
.tile .v{font-size:17.5px;font-weight:600;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:var(--fs-cap);color:var(--faint);margin-top:1px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.aq .v{color:var(--tone)}

/* ---------- roofing window ---------- */
.roof{padding:0;overflow:hidden}
.roof-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:none;border:none;padding:14px 14px 12px;font:inherit;color:inherit}
.roof-head .chev{color:var(--faint);font-size:20px}
.verdict{display:inline-grid;place-items:center;min-width:64px;height:64px;border-radius:16px;font-weight:900;font-size:15px;letter-spacing:.06em;
  background:var(--tone);color:#06131B;padding:0 8px;text-align:center;line-height:1.05}
.verdict.go{--tone:var(--good)} .verdict.caution{--tone:var(--warn)} .verdict.nogo{--tone:var(--crit)} .verdict.wait{--tone:var(--dim)}
:root[data-theme="light"] .verdict,:root:not([data-theme="dark"]) .verdict{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .verdict{color:#06131B}}
.roof-head b{display:block;font-size:var(--fs-body);line-height:1.35}
.roof-head small{display:block;color:var(--dim);font-size:var(--fs-cap);margin-top:2px;line-height:1.4}
.roofstrip{display:flex;gap:1.5px;height:22px;padding:0 14px}
.roofstrip i{flex:1;border-radius:2px;background:var(--card2)}
.roofstrip i.r0{background:var(--good)} .roofstrip i.r1{background:var(--warn)} .roofstrip i.r2{background:var(--crit)}
.roofstrip i.r3{background:var(--card2)} .roofstrip i.now{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.roofdays{display:flex;padding:4px 14px 0;font-size:var(--fs-micro);color:var(--faint);font-weight:700}
.roofdays span{flex:1}
.rooffacts{padding:10px 14px 4px;display:grid;gap:0}
.rf{display:grid;grid-template-columns:20px 72px 1fr;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:var(--fs-label)}
.rf .k{color:var(--dim);font-weight:700;font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.06em}
.rf .d{width:10px;height:10px;border-radius:50%;background:var(--tone,var(--good));align-self:center;justify-self:center}
.rf.r1 .d{--tone:var(--warn)} .rf.r2 .d{--tone:var(--crit)} .rf.r3 .d{--tone:var(--faint)}
.roofneed{display:flex;align-items:center;gap:6px;padding:8px 14px 12px;font-size:var(--fs-cap);color:var(--dim);flex-wrap:wrap;border-top:1px solid var(--line)}
.roofneed .lab{margin-right:4px;font-weight:700}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:0 12px;min-height:34px;font-weight:700;font-size:var(--fs-cap)}
.chip.on{background:var(--blue);color:#06131B;border-color:transparent}
:root[data-theme="light"] .chip.on,:root:not([data-theme="dark"]) .chip.on{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#06131B}}
.roofbest{padding:0 14px 12px;font-size:var(--fs-label);line-height:1.45}
.roofbest b{color:var(--good)}

/* ---------- map launcher ---------- */
.mapbtn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-top:11px;
  box-shadow:var(--shadow),var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.mapbtn svg{width:34px;height:34px;color:var(--blue)}
.mapbtn b{display:block;font-size:var(--fs-body)}
.mapbtn small{display:block;color:var(--dim);font-size:var(--fs-cap)}
.mapbtn .chev{color:var(--faint);font-size:20px}

/* ---------- hourly strip ---------- */
.hours{display:flex;gap:2px;overflow-x:auto;margin:0 -16px;padding:2px 10px 6px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 0;border-radius:12px;scroll-snap-align:start;font-variant-numeric:tabular-nums}
.hr.now{background:var(--blue-soft)}
.hr,.day{cursor:pointer}
.hr:active,.day:active{background:var(--card2)}
.hr .t{font-size:var(--fs-cap);color:var(--dim);font-weight:600}
.hr.now .t{color:var(--blue)}
.hr svg{width:30px;height:32px}
.hr .v{font-size:var(--fs-body);font-weight:600}
.hr .p{font-size:var(--fs-micro);color:var(--rain);font-weight:700;min-height:15px}

/* ---------- daily ---------- */
.day{display:grid;grid-template-columns:52px 32px 36px 1fr;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.day:last-child{border-bottom:none;padding-bottom:2px}
.day:first-child{padding-top:2px}
.day .n{font-weight:600;font-size:var(--fs-body)}
.day svg{width:30px;height:32px}
.day .p{font-size:var(--fs-micro);color:var(--rain);font-weight:700;text-align:right}
.rng{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center}
.rng .lo{text-align:right;color:var(--dim);font-size:var(--fs-label)}
.rng .hi{font-weight:600;font-size:var(--fs-label)}
.rng .bar{position:relative;height:6px;border-radius:3px;background:var(--card2)}
.rng .bar i{position:absolute;top:0;bottom:0;border-radius:3px;
  background:linear-gradient(90deg,var(--cold),var(--hot))}

/* ---------- onboarding ---------- */
.onb{text-align:center;padding:34px 20px 30px}
.onb svg{width:96px;height:96px;margin:0 auto 10px}
.onb h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.onb p{margin:0 auto 20px;color:var(--dim);font-size:var(--fs-body);max-width:34ch}
.btn{display:block;width:100%;min-height:48px;border-radius:13px;border:1px solid var(--line);
  background:var(--card2);font-weight:700;font-size:var(--fs-body);padding:0 14px}
.btn.pri{background:var(--blue);color:#06131B;border-color:transparent}
:root[data-theme="light"] .btn.pri,:root:not([data-theme="dark"]) .btn.pri{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06131B}}
.btn + .btn{margin-top:9px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card-solid);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.4);
  max-width:600px;margin:0 auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:88vh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-h b{font-size:var(--fs-title)}
.xbtn{background:none;border:none;color:var(--blue);font-weight:700;font-size:15px;min-height:44px;padding:0 6px}
.sheet input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
  color:var(--ink);font:inherit;font-size:16px;padding:0 14px;margin-top:9px}
.sheet input::placeholder{color:var(--faint)}
.sheet-body{overflow-y:auto;min-height:0;flex:1;padding-bottom:4px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
  border-bottom:1px solid var(--line);min-height:52px}
.lrow:last-child{border-bottom:none}
.lrow .pick{background:none;border:none;text-align:left;padding:9px 4px;min-height:52px;display:block;width:100%}
.lrow .pick b{display:block;font-size:var(--fs-body);font-weight:600}
.lrow .pick small{display:block;color:var(--dim);font-size:var(--fs-cap)}
.lrow .pick.cur b{color:var(--blue)}
.lrow .rm{background:none;border:none;color:var(--faint);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.lrow .rm svg{width:16px;height:16px}
.empty{color:var(--faint);font-size:var(--fs-cap);text-align:center;padding:14px 0}

/* ---------- the explainer sheet ---------- */
.ibig{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:2px 0 0;font-variant-numeric:tabular-nums}
.ibig small{font-size:var(--fs-body);font-weight:600;color:var(--tone,var(--dim));margin-left:8px}
.meter{height:8px;border-radius:4px;background:var(--card2);position:relative;margin:14px 7px 6px}
.meter.grad{background:linear-gradient(90deg,var(--good),var(--warn),var(--crit))}
.meter.cool{background:linear-gradient(90deg,var(--cold),var(--card2) 50%,var(--hot))}
.meter i{position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;background:var(--tone,var(--blue));
  border:2.5px solid var(--card-solid);transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mlab{display:flex;justify-content:space-between;font-size:var(--fs-micro);color:var(--faint);padding:0 2px}
.irow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--fs-body)}
.irow:last-child{border-bottom:none}
.irow span:first-child{color:var(--dim)}
.irow b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.ipara{font-size:var(--fs-label);color:var(--dim);line-height:1.5;margin:12px 0 6px}
.ipara b{color:var(--ink)}
.isec{font-size:var(--fs-micro);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.11em;margin:16px 0 4px}

/* ---------- overlays (map, alerts) ---------- */
.ovl{position:fixed;inset:0;z-index:25;background:var(--ground);display:flex;flex-direction:column;
  max-width:600px;margin:0 auto}
.ovl-h{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;
  border-bottom:1px solid var(--line);background:var(--card);flex:none}
.ovl-h b{flex:1;text-align:center;font-size:17px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovl-h .sp{width:84px;flex:none}
.backbtn{background:none;border:none;color:var(--blue);font-size:15px;font-weight:600;
  display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 6px;width:84px}
.backbtn svg{width:20px;height:20px}
.ovl-body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 24px)}

#mapvp{flex:1;min-height:0;position:relative;overflow:hidden;background:#0b1220;touch-action:none;cursor:grab}
#mapvp:active{cursor:grabbing}
#mapWrap{position:absolute;inset:0;transform-origin:0 0}
#mapTiles,#mapRadar,#mapSvg{position:absolute;inset:0}
#mapTiles{filter:var(--tilefilter)}
#mapTiles img,#mapRadar img{position:absolute;width:256px;height:256px;pointer-events:none;-webkit-user-drag:none}
#mapRadar{opacity:.78}
#mapRadar .fr[hidden]{display:none}
#mapSvg{width:100%;height:100%;overflow:visible;pointer-events:none}
#mapSvg path{fill:var(--tone);fill-opacity:.18;stroke:var(--tone);stroke-width:2.5;stroke-linejoin:round}
#mapSvg .me{fill:var(--blue);stroke:#fff;stroke-width:2.5}
#mapSvg .mering{fill:var(--blue);fill-opacity:.22}
.mapz{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapz button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card-solid);
  color:var(--ink);font-size:21px;font-weight:600;display:grid;place-items:center;box-shadow:var(--shadow)}
.mapz button svg{width:20px;height:20px}
.maplegend{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;
  background:var(--card-solid);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:var(--fs-micro);font-weight:700;color:var(--dim)}
.maplegend span{display:flex;align-items:center;gap:6px}
.maplegend i{width:12px;height:12px;border-radius:3px;background:var(--tone);opacity:.9;flex:none}
.maplegend i.grad{width:44px;height:9px;background:linear-gradient(90deg,#8fd97a,#f3e04f,#f29a2e,#e23a2e,#b43fc9)}
.maplegend .quiet{color:var(--faint);font-weight:600}
.mapbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;
  border-top:1px solid var(--line);background:var(--card);flex:none}
.mapbar button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center}
.mapbar button svg{width:18px;height:18px}
.mapbar input[type=range]{width:100%;accent-color:var(--blue)}
.mapbar .ft{font-size:var(--fs-cap);color:var(--dim);font-variant-numeric:tabular-nums;min-width:76px;text-align:right}
.mapbar .ft b{color:var(--ink)}
.mapnote{font-size:10.5px;color:var(--faint);text-align:center;padding:4px 10px calc(env(safe-area-inset-bottom) + 6px);background:var(--card)}
.mapnote a{color:var(--faint)}
.mapmsg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--card-solid);border:1px solid var(--line);
  border-radius:10px;padding:6px 12px;font-size:var(--fs-cap);color:var(--dim);white-space:nowrap}

/* ---------- toast + error bar ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:40;
  transform:translateX(-50%) translateY(8px);background:var(--card-solid);color:var(--ink);
  border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:10px 14px;
  font-size:var(--fs-label);font-weight:600;opacity:0;pointer-events:none;transition:all .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#errbar{margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:#3a1212;color:#ffd7d7;
  border:1px solid #7a2a2a;font-size:13px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="hdr-top">
      <div class="hdr-side">
        <button class="ibtn" id="unitBtn" aria-label="Switch temperature unit">°F</button>
      </div>
      <button class="hdr-title" id="locBtn" aria-haspopup="dialog" aria-controls="sheet">
        <span id="hTitle">Roney Weather</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="hdr-side right">
        <button class="ibtn" id="refreshBtn" aria-label="Refresh forecast">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button class="ibtn" id="themeBtn" aria-label="Switch light or dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="hdr-sub" id="hSub"></div>
  </header>

  <div id="errbar" hidden></div>
  <main id="view" aria-live="polite"></main>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Places" aria-hidden="true">
    <div class="sheet-h"><b>Places</b><button class="xbtn" id="sheetDone">Done</button></div>
    <button class="btn" id="geoBtn">Use my location</button>
    <input id="q" type="search" placeholder="Search a city" autocomplete="off" autocorrect="off" aria-label="Search a city">
    <div class="sheet-body">
      <div id="results"></div>
      <div class="sec-label" style="margin-top:14px">Saved</div>
      <div id="saved"></div>
    </div>
  </section>

  <section class="sheet" id="info" role="dialog" aria-modal="true" aria-label="Details" aria-hidden="true">
    <div class="sheet-h"><b id="infoT">Details</b><button class="xbtn" id="infoDone">Done</button></div>
    <div class="sheet-body" id="infoB"></div>
  </section>

  <!-- Radar & warnings: a hand-rolled slippy map. Base tiles from OpenStreetMap,
       radar frames from Rain Viewer, warning polygons from the NWS. -->
  <section class="ovl" id="mapOvl" hidden aria-label="Radar and warnings">
    <div class="ovl-h">
      <button class="backbtn" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
      <b id="mapTitle">Radar</b><span class="sp"></span>
    </div>
    <div id="mapvp">
      <div id="mapWrap"><div id="mapTiles"></div><div id="mapRadar"></div><svg id="mapSvg" aria-hidden="true"></svg></div>
      <div class="maplegend" id="mapLegend"></div>
      <div class="mapz">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zhome" aria-label="Center on place"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
      </div>
      <div class="mapmsg" id="mapMsg" hidden></div>
    </div>
    <div class="mapbar">
      <button id="playBtn" aria-label="Play radar loop"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>
      <input type="range" id="frameSl" min="0" max="0" value="0" aria-label="Radar frame">
      <div class="ft" id="frameT">—</div>
    </div>
    <div class="mapnote">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · Weather data by <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">Rain Viewer</a> · Warnings by NWS</div>
  </section>

  <section class="ovl" id="alertsOvl" hidden aria-label="Active alerts">
    <div class="ovl-h">
      <button class="backbtn" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
      <b>Alerts</b><span class="sp"></span>
    </div>
    <div class="ovl-body" id="alertsBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
"use strict";
/* ================= state ================= */
const APP_VERSION = "w7 · roofing window";
const KEY = "roney-weather-v1";
const STALE_MS = 10 * 60 * 1000;         // re-fetch when the forecast is older than this
const FORECAST = "https://api.open-meteo.com/v1/forecast";
const AIR = "https://air-quality-api.open-meteo.com/v1/air-quality";
const GEOCODE = "https://geocoding-api.open-meteo.com/v1/search";
const REVERSE = "https://api.bigdatacloud.net/data/reverse-geocode-client";
const NWS = "https://api.weather.gov/alerts/active";
const RADAR = "https://api.rainviewer.com/public/weather-maps.json";
const OSM = "https://tile.openstreetmap.org";
const RADAR_MAX_Z = 7;                   // Rain Viewer's free tier stops here; we upscale past it
// Only warnings and watches someone would act on go on the map. Everything
// NWS says about the place itself still shows in the alerts list.
const MAP_EVENTS = ["Tornado Warning", "Severe Thunderstorm Warning", "Flash Flood Warning", "Flash Flood Emergency",
  "Extreme Wind Warning", "Tornado Watch", "Severe Thunderstorm Watch", "Flood Warning", "Blizzard Warning",
  "Winter Storm Warning", "Ice Storm Warning", "Hurricane Warning", "Tropical Storm Warning", "Dust Storm Warning"];

const S = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.schema === 1 && Array.isArray(s.locs)) return s;
  } catch (e) { /* fall through to a fresh state */ }
  return { schema: 1, unit: "F", theme: "", locs: [], cur: 0, cache: {}, roofHours: 6 };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Couldn't save — storage is full"); }
}

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const curLoc = () => S.locs[S.cur] || null;
const ckey = l => l.lat.toFixed(3) + "," + l.lon.toFixed(3);
const cacheFor = l => l ? S.cache[ckey(l)] || null : null;
const COMPASS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
const compass = deg => COMPASS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const STATES = { Alabama: "AL", Alaska: "AK", Arizona: "AZ", Arkansas: "AR", California: "CA", Colorado: "CO", Connecticut: "CT",
  Delaware: "DE", Florida: "FL", Georgia: "GA", Hawaii: "HI", Idaho: "ID", Illinois: "IL", Indiana: "IN", Iowa: "IA", Kansas: "KS",
  Kentucky: "KY", Louisiana: "LA", Maine: "ME", Maryland: "MD", Massachusetts: "MA", Michigan: "MI", Minnesota: "MN",
  Mississippi: "MS", Missouri: "MO", Montana: "MT", Nebraska: "NE", Nevada: "NV", "New Hampshire": "NH", "New Jersey": "NJ",
  "New Mexico": "NM", "New York": "NY", "North Carolina": "NC", "North Dakota": "ND", Ohio: "OH", Oklahoma: "OK", Oregon: "OR",
  Pennsylvania: "PA", "Rhode Island": "RI", "South Carolina": "SC", "South Dakota": "SD", Tennessee: "TN", Texas: "TX", Utah: "UT",
  Vermont: "VT", Virginia: "VA", Washington: "WA", "West Virginia": "WV", Wisconsin: "WI", Wyoming: "WY", "District of Columbia": "DC",
  "Puerto Rico": "PR" };
// NWS covers the US and its territories; everyone else just doesn't get the alert calls.
function inUS(l) {
  if (l.cc) return l.cc === "US" || l.cc === "PR" || l.cc === "GU" || l.cc === "VI";
  return (l.lat > 24 && l.lat < 50 && l.lon > -125 && l.lon < -66) || (l.lat > 51 && l.lon < -129) || (l.lat > 18 && l.lat < 23 && l.lon < -154);
}
function stateOf(l) { return l.state || (STATES[l.admin] || (/^[A-Z]{2}$/.test(l.admin || "") ? l.admin : "")); }

// Everything is fetched in °F / mph / inches and converted on display, so a unit
// flip never costs a network round trip and the cache stays one shape.
const U = {
  temp: f => S.unit === "F" ? Math.round(f) : Math.round((f - 32) * 5 / 9),
  wind: mph => S.unit === "F" ? Math.round(mph) + " mph" : Math.round(mph * 1.609) + " km/h",
  prec: inch => S.unit === "F"
    ? (inch < 0.005 ? "0" : inch.toFixed(2).replace(/0$/, "")) + " in"
    : (inch * 25.4 < 0.05 ? "0" : (inch * 25.4).toFixed(1).replace(/\.0$/, "")) + " mm",
  dist: m => S.unit === "F" ? (m / 1609.34 >= 9.95 ? "10+" : (m / 1609.34).toFixed(m / 1609.34 < 2 ? 1 : 0)) + " mi"
                           : (m / 1000 >= 9.95 ? "10+" : (m / 1000).toFixed(m / 1000 < 2 ? 1 : 0)) + " km",
  pres: hpa => S.unit === "F" ? (hpa * 0.02953).toFixed(2) + " inHg" : Math.round(hpa) + " hPa",
};
const deg = f => U.temp(f) + "°";

function fmtHour(iso) {          // "2026-11-01T14:00" -> "2 PM"
  const h = parseInt(iso.slice(11, 13), 10);
  return h === 0 ? "12 AM" : h === 12 ? "12 PM" : h < 12 ? h + " AM" : (h - 12) + " PM";
}
function fmtClock(iso) {         // "2026-11-01T07:48" -> "7:48 AM"  (works on NWS offsets too)
  const h = parseInt(iso.slice(11, 13), 10), m = iso.slice(14, 16);
  return (h % 12 || 12) + ":" + m + (h < 12 ? " AM" : " PM");
}
function fmtDay(iso, todayIso) { // "2026-11-01" -> "Today" / "Mon"
  if (iso === todayIso) return "Today";
  const [y, m, d] = iso.slice(0, 10).split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short" });
}
function fmtWhen(iso, todayIso) { // NWS "2026-11-02T18:45:00-06:00" -> "6:45 PM" or "Mon 6:45 PM"
  if (!iso) return "";
  const day = iso.slice(0, 10);
  return (todayIso && day === todayIso ? "" : fmtDay(day, todayIso) + " ") + fmtClock(iso);
}
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 48 ? h + " h ago" : Math.round(h / 24) + " days ago";
}
function uvLabel(v) {
  return v < 3 ? "Low" : v < 6 ? "Moderate" : v < 8 ? "High" : v < 11 ? "Very high" : "Extreme";
}
// US EPA bands; the tone drives the tile colour.
function aqiBand(v) {
  return v <= 50 ? ["Good", "good"] : v <= 100 ? ["Moderate", "warn"] : v <= 150 ? ["Unhealthy for sensitive", "watch"]
    : v <= 200 ? ["Unhealthy", "crit"] : v <= 300 ? ["Very unhealthy", "crit"] : ["Hazardous", "crit"];
}
function locLabel(l) { return [l.admin, l.cc].filter(Boolean).join(", "); }
// Plain words for the numbers. Every scale the app shows has a sentence behind it.
function windWord(mph) {
  return mph < 1 ? "Calm" : mph < 4 ? "Light air" : mph < 8 ? "Light breeze" : mph < 13 ? "Gentle breeze" : mph < 19 ? "Moderate breeze"
    : mph < 25 ? "Fresh breeze" : mph < 32 ? "Strong breeze" : mph < 39 ? "Near gale" : mph < 47 ? "Gale" : mph < 55 ? "Strong gale" : mph < 64 ? "Storm" : "Violent storm";
}
function dewWord(f) {
  return f < 40 ? "Very dry" : f < 50 ? "Dry and comfortable" : f < 60 ? "Comfortable" : f < 65 ? "A bit sticky" : f < 70 ? "Muggy" : f < 75 ? "Oppressive" : "Miserable";
}
function rainWord(pct) { return pct < 20 ? "Rain unlikely" : pct < 50 ? "Rain possible" : pct < 70 ? "Rain likely" : "Expect rain"; }
function uvAdvice(v) {
  return v < 3 ? "No sun protection needed for most people." : v < 6 ? "Hat and sunscreen if you're out for a while." : v < 8 ? "Sunscreen, a hat, and shade in the middle of the day."
    : v < 11 ? "Limit time in the midday sun; skin burns fast." : "Stay out of the midday sun; unprotected skin burns in minutes.";
}
function aqiAdvice(v) {
  return v <= 50 ? "The air is clean. Nothing to think about." : v <= 100 ? "Fine for almost everyone. The unusually sensitive may want to go easier on long outdoor exertion."
    : v <= 150 ? "People with asthma, heart or lung disease, children and older adults should cut back on long or hard outdoor exertion."
    : v <= 200 ? "Everyone should reduce prolonged or heavy exertion outdoors; sensitive groups should avoid it."
    : v <= 300 ? "Avoid outdoor exertion. Sensitive groups should stay indoors." : "Stay indoors with windows closed. This is an emergency level.";
}
function visWord(m) { const mi = m / 1609.34; return mi < 0.3 ? "Dense fog" : mi < 1 ? "Fog" : mi < 3 ? "Mist or haze" : mi < 6 ? "Slightly hazy" : "Clear"; }
function cloudWord(pct) { return pct < 10 ? "clear sky" : pct < 30 ? "mostly clear" : pct < 70 ? "partly cloudy" : pct < 90 ? "mostly cloudy" : "overcast"; }
function presWord(trend) {
  return trend === "rising" ? "Rising pressure usually means clearing, settled weather on the way."
    : trend === "falling" ? "Falling pressure usually means unsettled weather is coming — clouds, wind, rain."
    : "Steady pressure: no change in the weather pattern is being signalled.";
}
function minsBetween(a, b) { return (parseInt(b.slice(11, 13), 10) * 60 + parseInt(b.slice(14, 16), 10)) - (parseInt(a.slice(11, 13), 10) * 60 + parseInt(a.slice(14, 16), 10)); }
function fmtDur(min) { min = Math.round(min); return Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0") + " min"; }
function fmtDate(iso) { const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }); }
const clamp01 = v => Math.max(0, Math.min(1, v));
// Moon phase from the mean synodic month — good to a few hours, plenty for a tile.
function moonPhase(dateIso) {
  const [y, m, d] = dateIso.slice(0, 10).split("-").map(Number);
  const days = (Date.UTC(y, m - 1, d, 12) - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
  const syn = 29.530588853, frac = ((days % syn) + syn) % syn / syn;
  const names = ["New moon", "Waxing crescent", "First quarter", "Waxing gibbous", "Full moon", "Waning gibbous", "Last quarter", "Waning crescent"];
  return { name: names[Math.round(frac * 8) % 8], illum: Math.round((1 - Math.cos(frac * 2 * Math.PI)) / 2 * 100),
    toFull: Math.round(((0.5 - frac + 1) % 1) * syn), toNew: Math.round(((1 - frac) % 1) * syn) };
}

/* ================= WMO weather codes → words + icon ================= */
const WMO = {
  0: ["Clear", "clear"], 1: ["Mostly clear", "clear"], 2: ["Partly cloudy", "partly"], 3: ["Overcast", "cloud"],
  45: ["Fog", "fog"], 48: ["Icy fog", "fog"],
  51: ["Light drizzle", "drizzle"], 53: ["Drizzle", "drizzle"], 55: ["Heavy drizzle", "drizzle"],
  56: ["Freezing drizzle", "sleet"], 57: ["Freezing drizzle", "sleet"],
  61: ["Light rain", "rain"], 63: ["Rain", "rain"], 65: ["Heavy rain", "rain"],
  66: ["Freezing rain", "sleet"], 67: ["Freezing rain", "sleet"],
  71: ["Light snow", "snow"], 73: ["Snow", "snow"], 75: ["Heavy snow", "snow"], 77: ["Snow grains", "snow"],
  80: ["Light showers", "rain"], 81: ["Showers", "rain"], 82: ["Heavy showers", "rain"],
  85: ["Snow showers", "snow"], 86: ["Heavy snow showers", "snow"],
  95: ["Thunderstorm", "storm"], 96: ["Thunderstorm, hail", "storm"], 99: ["Thunderstorm, hail", "storm"],
};
const wx = code => WMO[code] || ["Unsettled", "cloud"];

/* ================= icons (inline SVG, 24×26 box) ================= */
function rays(cx, cy, r1, r2) {
  let s = "";
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    s += `<line x1="${(cx + r1 * Math.cos(a)).toFixed(2)}" y1="${(cy + r1 * Math.sin(a)).toFixed(2)}" x2="${(cx + r2 * Math.cos(a)).toFixed(2)}" y2="${(cy + r2 * Math.sin(a)).toFixed(2)}"/>`;
  }
  return s;
}
const SUN = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--sun)"/>` +
  `<g stroke="var(--sun)" stroke-width="1.7" stroke-linecap="round">${rays(cx, cy, r + 2.2, r + 4.4)}</g>`;
const MOON = (cx, cy, r) => `<path fill="var(--dim)" d="M${cx + r * .35} ${cy - r} A${r} ${r} 0 1 0 ${cx + r * .35} ${cy + r} A${r * .78} ${r * .78} 0 1 1 ${cx + r * .35} ${cy - r}Z"/>`;

  const l = curLoc();
  if (!l) { render(); return; }
  const c = cacheFor(l);
  if (c && c.d && !force && Date.now() - c.at < STALE_MS) { render(); return; }
  setBusy(true); render();
  const us = inUS(l);
  const [fc, aq, al] = await Promise.allSettled([
    getJson(forecastUrl(l)),
    getJson(airUrl(l)),
    us ? getJson(alertsUrl(l)) : Promise.resolve(null),
  ]);
  const k = ckey(l), prev = S.cache[k] || {};
  const next = { at: prev.at || 0, d: prev.d, aq: prev.aq, alerts: prev.alerts, alertsAt: prev.alertsAt };
  let failed = 0;
  if (fc.status === "fulfilled" && fc.value.current && fc.value.hourly && fc.value.daily) { next.d = fc.value; next.at = Date.now(); }
  else failed++;
  if (aq.status === "fulfilled" && aq.value) next.aq = aq.value;
  if (us) {
    if (al.status === "fulfilled" && al.value && Array.isArray(al.value.features)) {
      next.alerts = al.value.features.map(normAlert); next.alertsAt = Date.now();
    } else failed++;
  }
  if (next.d) { S.cache[k] = next; pruneCache(); save(); }
  if (fc.status !== "fulfilled") toast(c && c.d ? "Couldn't refresh — showing the last forecast" : "Couldn't load the forecast");
  else if (failed) toast("Forecast updated; alerts didn't come through");
  setBusy(false); render();
  if (!$("mapOvl").hidden) drawOverlay();
}
function pruneCache() {
  const keep = new Set(S.locs.map(ckey));
  for (const k of Object.keys(S.cache)) if (!keep.has(k)) delete S.cache[k];
}

function addLoc(l) {
  const i = S.locs.findIndex(x => ckey(x) === ckey(l));
  if (i >= 0) { S.cur = i; S.locs[i].name = l.name || S.locs[i].name; }
  else { S.locs.push(l); S.cur = S.locs.length - 1; }
  save(); closeSheet(); refresh(false);
}
function removeLoc(i) {
  S.locs.splice(i, 1);
  if (S.cur >= S.locs.length) S.cur = Math.max(0, S.locs.length - 1);
  pruneCache(); save(); renderSaved(); render(); refresh(false);
}

async function useMyLocation() {
  if (!navigator.geolocation) { toast("This browser can't share its location"); return; }
  const btn = $("geoBtn"); btn.disabled = true; btn.textContent = "Finding you…";
  try {
    const pos = await new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej, { timeout: 12000, maximumAge: 300000 }));
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    let name = "My location", admin = "", cc = "", state = "";
    try {
      const r = await fetch(REVERSE + "?latitude=" + lat + "&longitude=" + lon + "&localityLanguage=en");
      if (r.ok) {
        const g = await r.json();
        name = g.city || g.locality || g.principalSubdivision || name;
        admin = g.principalSubdivisionCode ? g.principalSubdivisionCode.replace(/^.*-/, "") : (g.principalSubdivision || "");
        cc = g.countryCode || "";
        state = cc === "US" && /^[A-Z]{2}$/.test(admin) ? admin : "";
      }
    } catch (e) { /* the forecast doesn't need a name */ }
    addLoc({ name, admin, cc, state, lat, lon, mine: true });
  } catch (e) {
    toast(e && e.code === 1 ? "Location access was denied" : "Couldn't get your location");
  } finally {
    btn.disabled = false; btn.textContent = "Use my location";
  }
}

let searchT = 0, searchSeq = 0;
async function search(q) {
  q = q.trim();
  const box = $("results");
  if (q.length < 2) { box.innerHTML = ""; return; }
  const seq = ++searchSeq;
  try {
    const r = await fetch(GEOCODE + "?" + new URLSearchParams({ name: q, count: "6", language: "en", format: "json" }));
    const d = await r.json();
    if (seq !== searchSeq) return;           // a newer keystroke won
    const rows = (d.results || []).map(x => ({
      name: x.name, admin: x.admin1 || "", cc: x.country_code ? x.country_code.toUpperCase() : "",
      lat: x.latitude, lon: x.longitude,
    }));
    box.innerHTML = rows.length ? rows.map((x, i) =>
      `<div class="lrow"><button class="pick" data-pick="${i}"><b>${esc(x.name)}</b><small>${esc(locLabel(x))}</small></button></div>`).join("")
      : `<div class="empty">Nothing found for “${esc(q)}”</div>`;
    box.rows = rows;
  } catch (e) {
    if (seq === searchSeq) box.innerHTML = `<div class="empty">Search needs a signal</div>`;
  }
}

/* ================= sheet ================= */
function renderSaved() {
  $("saved").innerHTML = S.locs.length ? S.locs.map((l, i) =>
    `<div class="lrow"><button class="pick${i === S.cur ? " cur" : ""}" data-sel="${i}"><b>${esc(l.name)}</b><small>${esc(locLabel(l) || (l.mine ? "from your phone's location" : ""))}</small></button>
     <button class="rm" data-rm="${i}" aria-label="Remove ${esc(l.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("")
    : `<div class="empty">No saved places yet</div>`;
}
function openSheet(focusSearch) {
  renderSaved();
  $("sheet").classList.add("on"); $("scrim").classList.add("on");
  $("sheet").setAttribute("aria-hidden", "false");
  if (focusSearch) setTimeout(() => $("q").focus(), 280);
}
function closeSheet() {
  $("sheet").classList.remove("on"); if (!$("info").classList.contains("on")) $("scrim").classList.remove("on");
  $("sheet").setAttribute("aria-hidden", "true");
  $("q").value = ""; $("results").innerHTML = "";
}

/* ================= overlays: #map and #alerts ride the history stack ================= */
function openOverlay(name) { history.pushState({ ovl: name }, "", "#" + name); route(); }
function closeOverlay() { if (history.state && history.state.ovl) history.back(); else { history.replaceState(null, "", location.pathname); route(); } }
function route() {
  const h = location.hash.replace("#", "");
  const map = h === "map", al = h === "alerts";
  $("mapOvl").hidden = !map; $("alertsOvl").hidden = !al;
  document.body.style.overflow = map || al ? "hidden" : "";
  if (al) renderAlerts();
  if (map) openMap(); else stopLoop();
}

/* ================= the map ================= */
// Web Mercator in pixels at an integer zoom; tiles are 256 px.
const TILE = 256;
function proj(lat, lon, z) {
  const n = TILE * Math.pow(2, z), s = Math.sin(lat * Math.PI / 180);
  return [(lon + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n];
}
function unproj(x, y, z) {
  const n = TILE * Math.pow(2, z), k = Math.PI - 2 * Math.PI * y / n;
  return [180 / Math.PI * Math.atan(0.5 * (Math.exp(k) - Math.exp(-k))), x / n * 360 - 180];
}
const MAP = { lat: 0, lon: 0, z: 7, frames: [], host: "", fi: 0, timer: 0, loc: null, radarAt: 0, areaAlerts: null, areaAt: 0 };
let TILES_SEEN = 0; // the suite counts these

function openMap() {
  const l = curLoc();
  if (!l) { closeOverlay(); return; }
  if (MAP.loc !== ckey(l)) { MAP.loc = ckey(l); MAP.lat = l.lat; MAP.lon = l.lon; MAP.z = 7; }
  $("mapTitle").textContent = "Radar · " + l.name;
  drawMap();
  loadRadar();
  loadAreaAlerts(l);
}
function mapSize() { const r = $("mapvp").getBoundingClientRect(); return [Math.max(r.width, 1), Math.max(r.height, 1)]; }
function origin() { const [W, H] = mapSize(); const [cx, cy] = proj(MAP.lat, MAP.lon, MAP.z); return [cx - W / 2, cy - H / 2, W, H]; }

// Place/refresh the <img> tiles of one layer for the current view. Existing
// elements are moved, not recreated, so panning doesn't refetch.
function layTiles(layer, urlFor, zCap) {
  const [ox, oy, W, H] = origin();
  const z = Math.min(MAP.z, zCap), f = Math.pow(2, MAP.z - z), size = TILE * f, n = Math.pow(2, z);
  const x0 = Math.floor(ox / size), x1 = Math.floor((ox + W) / size), y0 = Math.max(0, Math.floor(oy / size)), y1 = Math.min(n - 1, Math.floor((oy + H) / size));
  const keep = new Set();
  for (let tx = x0; tx <= x1; tx++) for (let ty = y0; ty <= y1; ty++) {
    const wx = ((tx % n) + n) % n, key = z + "/" + wx + "/" + ty + "@" + tx;
    keep.add(key);
    let img = layer.querySelector(`[data-k="${key}"]`);
    if (!img) {
      img = document.createElement("img"); img.dataset.k = key; img.alt = ""; img.decoding = "async";
      img.src = urlFor(z, wx, ty); layer.appendChild(img); TILES_SEEN++;
    }
    img.style.left = (tx * size - ox) + "px"; img.style.top = (ty * size - oy) + "px";
    img.style.width = img.style.height = size + "px";
  }
  for (const el of layer.querySelectorAll("img")) if (!keep.has(el.dataset.k)) el.remove();
}
function drawMap() {
  $("mapWrap").style.transform = "";
  layTiles($("mapTiles"), (z, x, y) => `${OSM}/${z}/${x}/${y}.png`, 19);
  const fr = $("mapRadar").children;
  for (let i = 0; i < fr.length; i++) {
    const path = fr[i].dataset.path;
    layTiles(fr[i], (z, x, y) => `${MAP.host}${path}/${TILE}/${z}/${x}/${y}/4/1_1.png`, RADAR_MAX_Z);
  }
  drawOverlay();
}
// Warning polygons + the place marker, in SVG so they stay crisp at any zoom.
function drawOverlay() {
  const [ox, oy] = origin(), svg = $("mapSvg");
  const l = curLoc(), c = cacheFor(l);
  const seen = new Set(), list = [];
  for (const a of [...(MAP.areaAlerts || []), ...(c && c.alerts || [])]) {
    if (!a.geom || seen.has(a.id)) continue; seen.add(a.id); list.push(a);
  }
  list.sort((a, b) => TONE_RANK[b.tone] - TONE_RANK[a.tone]); // most urgent drawn last, on top
  let s = "";
  for (const a of list) {
    let d = "";
    for (const ring of a.geom) {
      d += ring.map(([lon, lat], i) => { const [x, y] = proj(lat, lon, MAP.z); return (i ? "L" : "M") + (x - ox).toFixed(1) + " " + (y - oy).toFixed(1); }).join("") + "Z";
    }
    s += `<path class="${a.tone}" d="${d}"><title>${esc(a.event)}</title></path>`;
  }
  if (l) {
    const [x, y] = proj(l.lat, l.lon, MAP.z);
    s += `<circle class="mering" cx="${(x - ox).toFixed(1)}" cy="${(y - oy).toFixed(1)}" r="16"/><circle class="me" cx="${(x - ox).toFixed(1)}" cy="${(y - oy).toFixed(1)}" r="6"/>`;
  }
  svg.innerHTML = s;
  const tones = [...new Set(list.map(a => a.tone))].sort((a, b) => TONE_RANK[a] - TONE_RANK[b]);
  const label = { crit: "Tornado / extreme", warn: "Warning", watch: "Watch", info: "Advisory" };
  const st = l ? stateOf(l) : "";
  $("mapLegend").innerHTML = `<span><i class="grad"></i>Radar: light → heavy</span>` +
    (tones.length ? tones.map(t => `<span class="${t}"><i></i>${label[t]}</span>`).join("")
      : `<span class="quiet">${l && inUS(l) ? "No warnings in " + esc(st || "this area") + " right now" : "Warnings: US places only"}</span>`);
}
async function loadRadar() {
  if (Date.now() - MAP.radarAt < 5 * 60 * 1000 && MAP.frames.length) { drawMap(); return; }
  $("mapMsg").hidden = false; $("mapMsg").textContent = "Loading radar…";
  try {
    const j = await getJson(RADAR);
    const past = (j.radar && j.radar.past || []).slice(-8), now = j.radar && j.radar.nowcast || [];
    MAP.host = j.host || "https://tilecache.rainviewer.com";
    MAP.frames = past.concat(now).map(f => ({ time: f.time, path: f.path, future: now.includes(f) }));
    MAP.radarAt = Date.now();
    const box = $("mapRadar"); box.innerHTML = "";
    for (const f of MAP.frames) { const d = document.createElement("div"); d.className = "fr"; d.dataset.path = f.path; d.hidden = true; box.appendChild(d); }
    $("frameSl").max = String(Math.max(0, MAP.frames.length - 1));
    MAP.fi = Math.max(0, past.length - 1);     // open on the latest observed frame
    drawMap(); showFrame(MAP.fi);
    if (!MAP.hinted) { MAP.hinted = true; $("mapMsg").textContent = "Drag to pan · pinch to zoom · ▶ plays the last 2 hours"; setTimeout(() => { if (/Drag/.test($("mapMsg").textContent)) $("mapMsg").hidden = true; }, 6000); }
    else $("mapMsg").hidden = true;
  } catch (e) {
    $("mapMsg").hidden = false; $("mapMsg").textContent = "Radar unavailable right now";
    drawMap();
  }
}
async function loadAreaAlerts(l) {
  const st = stateOf(l);
  if (!inUS(l) || !st) return;
  if (MAP.areaAlerts && MAP.areaState === st && Date.now() - MAP.areaAt < 3 * 60 * 1000) return;
  try {
    const j = await getJson(NWS + "?" + new URLSearchParams({ area: st, status: "actual", message_type: "alert,update", event: MAP_EVENTS.join(",") }));
    MAP.areaAlerts = (j.features || []).map(normAlert).filter(a => a.geom); MAP.areaState = st; MAP.areaAt = Date.now();
    drawOverlay();
  } catch (e) { /* the point alerts still draw */ }
}
function showFrame(i) {
  if (!MAP.frames.length) { $("frameT").textContent = "—"; return; }
  MAP.fi = Math.max(0, Math.min(i, MAP.frames.length - 1));
  const fr = $("mapRadar").children;
  for (let k = 0; k < fr.length; k++) fr[k].hidden = k !== MAP.fi;
  $("frameSl").value = String(MAP.fi);
  const f = MAP.frames[MAP.fi];
  const t = new Date(f.time * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  $("frameT").innerHTML = (f.future ? "<b>+" + Math.round((f.time - MAP.frames.filter(x => !x.future).slice(-1)[0].time) / 60) + " min</b> " : "") + esc(t);
}
function startLoop() {
  stopLoop();
  $("playBtn").innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`;
  $("playBtn").setAttribute("aria-label", "Pause radar loop");
  MAP.timer = setInterval(() => {
    if (!MAP.frames.length) return;
    showFrame((MAP.fi + 1) % MAP.frames.length);
  }, MAP.fi === MAP.frames.length - 1 ? 1400 : 600);
}
function stopLoop() {
  if (MAP.timer) clearInterval(MAP.timer); MAP.timer = 0;
  $("playBtn").innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>`;
  $("playBtn").setAttribute("aria-label", "Play radar loop");
}
function zoomTo(z, px, py) {           // keep the point under (px,py) fixed
  z = Math.max(3, Math.min(12, z));
  if (z === MAP.z) return;
  const [ox, oy, W, H] = origin();
  const [lat, lon] = unproj(ox + (px ?? W / 2), oy + (py ?? H / 2), MAP.z);
  const [nx, ny] = proj(lat, lon, z);
  const [clat, clon] = unproj(nx - ((px ?? W / 2) - W / 2), ny - ((py ?? H / 2) - H / 2), z);
  MAP.z = z; MAP.lat = clat; MAP.lon = clon;
  drawMap();
}
// Touch: one finger pans, two pinch (scaled with a CSS transform, committed to
// an integer zoom on release), wheel zooms about the cursor.
(function wireMap() {
  const vp = $("mapvp"), ptrs = new Map();
  let pinch = null, lastTap = 0;
  vp.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    vp.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], r = vp.getBoundingClientRect();
      pinch = { d0: Math.hypot(a[0] - b[0], a[1] - b[1]), mx: (a[0] + b[0]) / 2 - r.left, my: (a[1] + b[1]) / 2 - r.top, s: 1 };
    } else if (ptrs.size === 1) {
      const now = Date.now(), r = vp.getBoundingClientRect();
      if (now - lastTap < 300) { zoomTo(MAP.z + 1, e.clientX - r.left, e.clientY - r.top); lastTap = 0; } else lastTap = now;
    }
  });
  vp.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 1 && !pinch) {
      const [ox, oy, W, H] = origin();
      const [lat, lon] = unproj(ox + W / 2 - (e.clientX - prev[0]), oy + H / 2 - (e.clientY - prev[1]), MAP.z);
      MAP.lat = Math.max(-80, Math.min(80, lat)); MAP.lon = lon;
      drawMap();
    } else if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      pinch.s = Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d0;
      $("mapWrap").style.transformOrigin = pinch.mx + "px " + pinch.my + "px";
      $("mapWrap").style.transform = "scale(" + pinch.s + ")";
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (pinch && ptrs.size < 2) {
      const dz = Math.round(Math.log2(pinch.s)), p = pinch; pinch = null;
      $("mapWrap").style.transform = "";
      if (dz) zoomTo(MAP.z + dz, p.mx, p.my); else drawMap();
      ptrs.clear();
    }
  };
  vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up);
  vp.addEventListener("wheel", e => { e.preventDefault(); const r = vp.getBoundingClientRect(); zoomTo(MAP.z + (e.deltaY < 0 ? 1 : -1), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  $("zin").addEventListener("click", () => zoomTo(MAP.z + 1));
  $("zout").addEventListener("click", () => zoomTo(MAP.z - 1));
  $("zhome").addEventListener("click", () => { const l = curLoc(); if (l) { MAP.lat = l.lat; MAP.lon = l.lon; drawMap(); } });
  $("playBtn").addEventListener("click", () => MAP.timer ? stopLoop() : startLoop());
  $("frameSl").addEventListener("input", e => { stopLoop(); showFrame(+e.target.value); });
  window.addEventListener("resize", () => { if (!$("mapOvl").hidden) drawMap(); });
})();

/* ================= theme + toast ================= */
function applyTheme() {
  if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
}
function isDark() {
  return S.theme ? S.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
let toastT = 0;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ================= wiring ================= */
$("unitBtn").addEventListener("click", () => { S.unit = S.unit === "F" ? "C" : "F"; save(); render(); });
$("themeBtn").addEventListener("click", () => { S.theme = isDark() ? "light" : "dark"; save(); applyTheme(); });
$("refreshBtn").addEventListener("click", () => refresh(true));
$("locBtn").addEventListener("click", () => openSheet(false));
$("sheetDone").addEventListener("click", closeSheet);
$("infoDone").addEventListener("click", closeInfo);
$("scrim").addEventListener("click", () => { closeSheet(); closeInfo(); });
$("geoBtn").addEventListener("click", useMyLocation);
$("q").addEventListener("input", e => { clearTimeout(searchT); searchT = setTimeout(() => search(e.target.value), 280); });
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(searchT); search(e.target.value); } });
$("results").addEventListener("click", e => {
  const b = e.target.closest("[data-pick]"); if (!b) return;
  const row = ($("results").rows || [])[+b.dataset.pick]; if (row) addLoc(row);
});
$("saved").addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]");
  if (rm) { removeLoc(+rm.dataset.rm); return; }
  const sel = e.target.closest("[data-sel]");
  if (sel) { S.cur = +sel.dataset.sel; save(); closeSheet(); render(); refresh(false); }
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) { closeOverlay(); return; }
  const chip = e.target.closest("[data-roof]"); if (chip) { S.roofHours = +chip.dataset.roof; save(); render(); return; }
  const info = e.target.closest("[data-info]"); if (info) { openInfo(info.dataset.info); return; }
  const hr = e.target.closest("[data-hour]"); if (hr) { openInfo("hour", +hr.dataset.hour); return; }
  const dy = e.target.closest("[data-day]"); if (dy) { openInfo("day", +dy.dataset.day); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "geo") { openSheet(false); useMyLocation(); }
  else if (b.dataset.act === "search") openSheet(true);
  else if (b.dataset.act === "refresh") refresh(true);
  else if (b.dataset.act === "map") openOverlay("map");
  else if (b.dataset.act === "alerts") openOverlay("alerts");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSheet(); closeInfo(); if (location.hash) closeOverlay(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-hour],[data-day]")) { e.preventDefault(); e.target.click(); }
});
window.addEventListener("popstate", route);
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
window.addEventListener("online", () => refresh(false));
setInterval(() => { if (curLoc() && cacheFor(curLoc()) && $("mapOvl").hidden) render(); }, 60000); // keeps "updated N min ago" honest

// Own small parachute: a render failure should say so on screen, not go blank.
window.addEventListener("error", e => {
  const bar = $("errbar"); if (!bar) return;
  bar.hidden = false;
  bar.textContent = "Something broke on " + APP_VERSION + ":\n" + (e.message || e.error || "unknown error");
});

applyTheme();
if (location.hash) history.replaceState(null, "", location.pathname); // overlays never survive a reload
render();
route();
refresh(false);
// Offline shell. Network-first, so a deploy is live on the next open; the
// forecast itself is cached in localStorage above, not here.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
